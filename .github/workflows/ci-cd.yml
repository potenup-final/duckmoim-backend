name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPO: duckmoim-backend

jobs:
  build:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 17 설치
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 빌드 및 테스트
        run: ./gradlew build

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7

  image:
    name: 이미지 빌드 및 푸시
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write        # OIDC 로 AWS 역할을 맡기 위해 필요

    outputs:
      image: ${{ steps.tag.outputs.image }}

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v4

      # 이미지는 배포할 때만 필요하고 배포는 main 만 한다. 그래서 AWS 를 건드리는
      # 두 스텝은 main 에서만 돈다 — develop 머지마다 역할을 맡을 이유가 없다.
      #
      # 도커 빌드 자체는 모든 이벤트에서 돈다. Dockerfile 이 깨진 것을 main 머지
      # 순간에 알게 되면 그때는 이미 배포가 나가려는 중이다.
      #
      #   PR                    refs/pull/N/merge  → 빌드만. AWS 안 건드림
      #   develop push          refs/heads/develop → 빌드만. AWS 안 건드림
      #   main push · dispatch  refs/heads/main    → ECR 로그인 + 푸시

      # 장기 액세스 키 없이 역할을 맡는다. 자격증명은 이 잡 안에서만 유효하다.
      - name: AWS 자격증명 (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      # main 이 아니면 ECR 주소가 없다. 로컬 태그를 붙여 빌드만 한다 —
      # 태그가 비면 build-push-action 이 파싱에서 죽는다.
      - name: 이미지 주소 결정
        id: tag
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}"
            echo "이미지 주소: $IMAGE  (ECR 로 푸시한다)"
          else
            IMAGE="${{ env.ECR_REPO }}:${{ github.sha }}"
            echo "이미지 주소: $IMAGE  (로컬 태그. 빌드만 하고 버린다)"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: EC2 배포 (Blue-Green)
    needs: image
    # main 으로 향하는 push 는 PR 머지뿐이다 (브랜치 보호가 직접 push 를 막는다).
    # workflow_dispatch 로 main 을 골라도 event_name 이 달라 걸러진다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # 이 잡도 OIDC 로 역할을 맡아야 ALB 를 조작할 수 있다. image 잡에서 받은
    # 자격증명은 그 잡 안에서만 유효하다 — 잡이 다르면 러너가 다르다.
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: ${{ needs.image.outputs.image }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_HOST_BLUE: ${{ secrets.EC2_HOST_BLUE }}
      EC2_HOST_GREEN: ${{ secrets.EC2_HOST_GREEN }}
      TG_BLUE_ARN: ${{ secrets.TG_BLUE_ARN }}
      TG_GREEN_ARN: ${{ secrets.TG_GREEN_ARN }}
      LISTENER_ARN: ${{ secrets.LISTENER_ARN }}
      # 전환 뒤 확인은 실제 도메인으로 한다. ALB 주소로 때리면 인증서(CN=api.duckmoim.com)가
      # 맞지 않아 TLS 에서 먼저 끊긴다.
      SERVICE_URL: https://api.duckmoim.com

    steps:
      - name: AWS 자격증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 「이번엔 green 차례」를 기억하지 않는다. 리스너가 지금 무엇을 가리키는지 읽어서
      # 그 반대쪽을 고른다 — 배포 횟수를 세지 않아도 늘 노는 쪽에 올라간다.
      #
      # 시크릿이 비면 GitHub 이 빈 문자열로 렌더한다. 특히 TG_BLUE_ARN 이 비면 아래 비교가
      # 언제나 거짓이 되어 판정이 엉뚱한 가지로 빠지므로, 값이 없는 것을 먼저 끊는다.
      - name: 유휴 색 판별
        run: |
          for required in LISTENER_ARN TG_BLUE_ARN TG_GREEN_ARN \
                          EC2_HOST_BLUE EC2_HOST_GREEN; do
            if [ -z "${!required}" ]; then
              echo "::error::필수 시크릿 $required 가 비어 있다. Settings → Secrets and variables → Actions 를 확인한다"
              exit 1
            fi
          done

          LIVE_TG=$(aws elbv2 describe-listeners \
            --listener-arns "$LISTENER_ARN" \
            --query 'Listeners[0].DefaultActions[0].TargetGroupArn' --output text)

          if [ "$LIVE_TG" = "$TG_BLUE_ARN" ]; then
            DEPLOY_COLOR=green
            DEPLOY_HOST=$EC2_HOST_GREEN
            DEPLOY_TG=$TG_GREEN_ARN
          elif [ "$LIVE_TG" = "$TG_GREEN_ARN" ]; then
            DEPLOY_COLOR=blue
            DEPLOY_HOST=$EC2_HOST_BLUE
            DEPLOY_TG=$TG_BLUE_ARN
          else
            # blue 도 green 도 아니면 사람이 손으로 바꿔 둔 상태다. 추측해서 덮어쓰지 않는다.
            echo "::error::리스너가 가리키는 대상 그룹이 blue 도 green 도 아니다 — $LIVE_TG"
            exit 1
          fi

          # 다음 스텝들이 쓸 값을 넘긴다. 되돌릴 곳(PREVIOUS_TG)도 함께 남긴다.
          {
            echo "DEPLOY_COLOR=$DEPLOY_COLOR"
            echo "DEPLOY_HOST=$DEPLOY_HOST"
            echo "DEPLOY_TG=$DEPLOY_TG"
            echo "PREVIOUS_TG=$LIVE_TG"
          } >> "$GITHUB_ENV"

          echo "현재 live 는 ${LIVE_TG##*/} · 배포 대상은 $DEPLOY_COLOR ($DEPLOY_HOST)"

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # 접속 정보와 서명 열쇠는 ssh 뒤에 붙일 수 없다. 그 문자열은 EC2 에서 그대로
      # 프로세스가 되어 ps 에 평문으로 뜬다 — 같은 인스턴스에 들어온 누구든 읽는다.
      # stdin 으로만 보내 600 짜리 파일로 떨어뜨리고, docker run 이 읽은 직후 지운다.
      # 여기 목록이 곧 운영 설정의 전부다. application-prod.yml 은 기본값을 두지
      # 않으므로(JWT_SECRET · INGEST_KEY · KAKAO_CLIENT_ID) 하나라도 빠지면 조용히
      # 넘어가는 것이 아니라 컨테이너가 기동에서 죽고 헬스체크 20회가 다 타임아웃한다.
      # Secrets 에 값을 넣는 것만으로는 전달되지 않는다 — 이름을 여기에도 적어야 한다.
      - name: 환경 파일 전송
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
        run: |
          # 빈 시크릿을 여기서 끊는다. 없는 시크릿은 GitHub 이 빈 문자열로 렌더하는데,
          # 그러면 --env-file 에 "KAKAO_CLIENT_ID=" 가 실려 스프링이 「있는데 빈 값」으로
          # 읽는다. application-prod.yml 이 기본값을 안 둔 이유(기동 실패가 낫다)가
          # 그 순간 무력해진다 — 로그인만 안 되는 정상 기동이 헬스체크를 통과한다.
          #
          # KAKAO_CLIENT_SECRET 은 뺀다. 카카오 콘솔에서 「보안」을 켜지 않으면 보낼 값이
          # 없고, 켜지 않은 상태가 정상이라 필수로 두면 그 앱이 배포조차 못 한다.
          for required in DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET \
                          CORS_ALLOWED_ORIGINS INGEST_KEY KAKAO_CLIENT_ID \
                          S3_BUCKET S3_PUBLIC_BASE_URL; do
            if [ -z "${!required}" ]; then
              echo "::error::필수 시크릿 $required 가 비어 있다. Settings → Secrets and variables → Actions 를 확인한다"
              exit 1
            fi
          done

          # printf 는 셸 빌트인이라 값이 러너의 ps 에도 남지 않는다. 값을 포맷이 아니라
          # 인자로 넘겨 URL 안의 % 가 포맷 지정자로 해석되는 것도 막는다.
          #
          # 값에 따옴표를 두르지 않는다. --env-file 은 줄 전체를 KEY=VALUE 리터럴로 읽고
          # 확장도 따옴표 제거도 하지 않아서, 감싸면 따옴표까지 값이 된다.
          printf '%s\n' \
            "DB_URL=$DB_URL" \
            "DB_USERNAME=$DB_USERNAME" \
            "DB_PASSWORD=$DB_PASSWORD" \
            "JWT_SECRET=$JWT_SECRET" \
            "CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS" \
            "INGEST_KEY=$INGEST_KEY" \
            "KAKAO_CLIENT_ID=$KAKAO_CLIENT_ID" \
            "KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET" \
            "S3_BUCKET=$S3_BUCKET" \
            "S3_PUBLIC_BASE_URL=$S3_PUBLIC_BASE_URL" \
            | ssh -i ~/.ssh/deploy.pem "$EC2_USER@$DEPLOY_HOST" \
                'umask 077; cat > ~/duckmoim.env'

      # EC2 는 인스턴스 IAM 역할로 ECR 에 인증한다. ECR 자격증명은 서버에 두지 않는다.
      # 이 서버는 지금 트래픽을 안 받는 쪽이라, 컨테이너를 멈춰도 사용자에게 영향이 없다.
      - name: 컨테이너 교체
        run: |
          ssh -i ~/.ssh/deploy.pem "$EC2_USER@$DEPLOY_HOST" \
            "IMAGE='$IMAGE' AWS_REGION='$AWS_REGION' bash -s" <<'REMOTE'
          set -euo pipefail
          # docker run 이 값을 컨테이너 설정으로 복사한 뒤에는 파일이 필요 없다.
          # 중간에 실패해도 남지 않게 EXIT 에 걸어 둔다.
          trap 'rm -f "$HOME/duckmoim.env"' EXIT
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${IMAGE%%/*}"
          docker pull "$IMAGE"
          docker stop duckmoim-app 2>/dev/null || true
          docker rm   duckmoim-app 2>/dev/null || true
          # 루트 볼륨이 8GB 다. 기본 json-file 드라이버는 상한이 없어
          # 오래 돌수록 컨테이너 로그가 디스크를 먹는다. 30MB 로 묶는다.
          docker run -d \
            --name duckmoim-app \
            --restart unless-stopped \
            --log-opt max-size=10m \
            --log-opt max-file=3 \
            -e SPRING_PROFILES_ACTIVE=prod \
            --env-file "$HOME/duckmoim.env" \
            -p 8080:8080 \
            "$IMAGE"
          docker image prune -af --filter "until=72h"
          REMOTE

      # 전환 전 게이트다. 유휴 서버가 스스로 UP 이라고 답해야 리스너를 옮긴다.
      # 여기서 실패하면 리스너를 건드리지 않으므로 사용자는 계속 옛 버전을 쓴다 —
      # 배포가 실패한 것이지 서비스가 죽은 것이 아니다.
      - name: 유휴 서버 헬스체크
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://$DEPLOY_HOST:8080/api/health" | grep -q '"status":"UP"'; then
              echo "$DEPLOY_COLOR 기동 확인 — ${i}회차에서 UP"
              exit 0
            fi
            sleep 3
          done
          echo "::error::60초 안에 UP 이 되지 않았다. 리스너를 전환하지 않는다"
          ssh -i ~/.ssh/deploy.pem "$EC2_USER@$DEPLOY_HOST" \
            "docker logs --tail 50 duckmoim-app" || true
          exit 1

      # 배포의 전부가 이 한 번의 호출이다. 서버는 그대로 두고 안내 방향만 바꾼다.
      - name: 리스너 전환
        run: |
          aws elbv2 modify-listener \
            --listener-arn "$LISTENER_ARN" \
            --default-actions "Type=forward,TargetGroupArn=$DEPLOY_TG" \
            > /dev/null
          echo "리스너를 $DEPLOY_COLOR 로 옮겼다"

      # 바꿨다고 믿지 않고 다시 읽는다. 수동 전환 때 이 확인을 빠뜨려 「전환됐겠지」로
      # 넘어갔다가 유휴인 줄 알았던 서버를 멈춰 503 을 냈다.
      #
      # 대상 그룹은 리스너가 가리키기 전까지 unused 라 헬스체크를 받지 않는다. 그래서
      # healthy 판정은 전환 뒤에만 가능하고, 실패하면 되돌리는 것으로 대응한다.
      - name: 전환 확인 및 스모크 테스트
        run: |
          AFTER=$(aws elbv2 describe-listeners \
            --listener-arns "$LISTENER_ARN" \
            --query 'Listeners[0].DefaultActions[0].TargetGroupArn' --output text)
          if [ "$AFTER" != "$DEPLOY_TG" ]; then
            echo "::error::리스너가 전환되지 않았다 — 현재 $AFTER"
            exit 1
          fi

          STATE=none
          for i in $(seq 1 24); do
            STATE=$(aws elbv2 describe-target-health \
              --target-group-arn "$DEPLOY_TG" \
              --query 'TargetHealthDescriptions[0].TargetHealth.State' --output text)
            if [ "$STATE" = "healthy" ]; then
              break
            fi
            sleep 5
          done

          if [ "$STATE" = "healthy" ]; then
            for i in $(seq 1 10); do
              if curl -fsS "$SERVICE_URL/api/health" | grep -q '"status":"UP"'; then
                echo "배포 완료 — $DEPLOY_COLOR 가 서비스 중"
                exit 0
              fi
              sleep 3
            done
          fi

          echo "::error::전환 후 확인에 실패했다 (대상 그룹 상태: $STATE). 리스너를 되돌린다"
          aws elbv2 modify-listener \
            --listener-arn "$LISTENER_ARN" \
            --default-actions "Type=forward,TargetGroupArn=$PREVIOUS_TG" \
            > /dev/null
          exit 1
