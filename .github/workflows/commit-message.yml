name: 커밋 메시지 검사

# .githooks/prepare-commit-msg 가 커밋 제목에 [STAR-nn] 을 붙여준다. 그런데
# `git -c core.hooksPath=/dev/null commit` 이면 훅을 못 찾아 없는 것처럼 동작하고,
# 설치도 클론마다 해야 한다. 훅은 빠른 피드백이고 강제는 CI 가 한다.
#
# 검사 대상은 PR 에 담긴 커밋의 **제목**뿐이다. 본문 형식은 사람이 리뷰에서 본다.
#
# ⚠️ run 블록 안에서 heredoc 을 쓰지 않는다. 셸 heredoc 종료자는 줄 맨 앞에
#    와야 하는데 YAML 들여쓰기 때문에 공백이 붙어 종료되지 않는다.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  subjects:
    name: 제목 형식
    runs-on: ubuntu-latest

    steps:
      - name: 티켓 키 확인
        id: key
        env:
          BRANCH: ${{ github.head_ref }}
          PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          key=$(printf '%s' "$BRANCH" | grep -oE "${PROJECT_KEY}-[0-9]+" | head -n 1 || true)

          # 키가 없으면 핫픽스나 봇 PR 이다. jira-pr-sync 와 같은 판단을 쓴다 —
          # 그런 PR 을 막으면 급할 때 길이 없어진다.
          if [ -z "$key" ]; then
            echo "::notice::'$BRANCH' 에 ${PROJECT_KEY} 키가 없어 건너뜁니다 (핫픽스·봇 PR 은 정상 통과)"
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: 체크아웃
        if: steps.key.outputs.key != ''
        uses: actions/checkout@v5
        with:
          # PR 의 커밋 전부를 봐야 하므로 얕은 클론으로는 부족하다.
          fetch-depth: 0

      - name: 제목 검사
        if: steps.key.outputs.key != ''
        env:
          KEY: ${{ steps.key.outputs.key }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u

          # --no-merges: 머지 커밋의 제목은 git 이 만든 것이라 규약 대상이 아니다.
          git log --no-merges --format='%s' "$BASE_SHA..$HEAD_SHA" > subjects.txt

          if [ ! -s subjects.txt ]; then
            echo "::notice::검사할 커밋이 없습니다"
            exit 0
          fi

          # 인정하는 타입은 Jira 자동화가 브랜치·라벨을 정할 때 쓰는 여섯 개와 같다.
          failed=0
          while IFS= read -r subject; do
            [ -n "$subject" ] || continue
            if printf '%s' "$subject" | grep -qE "^\[${KEY}\] (feat|fix|refactor|test|chore|docs): .+"; then
              echo "  ✓ $subject"
            else
              echo "  ✗ $subject"
              echo "::error::커밋 제목이 형식에 맞지 않습니다 — $subject"
              failed=1
            fi
          done < subjects.txt

          [ "$failed" -eq 0 ] && { echo "::notice::커밋 제목 전부 통과"; exit 0; }

          echo ''
          echo '커밋 제목은 이 형식입니다.'
          echo ''
          echo "  [${KEY}] feat: 카드 등록 시 그룹·멤버 축 검증 추가"
          echo '   └ 훅이 붙임    └ feat · fix · refactor · test · chore · docs'
          echo ''
          echo '[KEY] 를 손으로 붙이지 마세요. 훅이 브랜치명에서 뽑아 붙입니다.'
          echo '안 붙었다면 훅이 안 켜진 것입니다.'
          echo ''
          echo '  ./gradlew build           # 훅을 켠다'
          echo '  git config core.hooksPath # .githooks 가 나와야 한다'
          echo ''
          echo '이미 만든 커밋은 git rebase -i 로 reword 합니다.'
          exit 1
