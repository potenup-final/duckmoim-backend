name: Jira 착수 → 이슈·브랜치 생성

# Fired by a single Jira Automation rule when a ticket moves to 진행 중.
# That rule is the only Jira automation in the whole setup — the Free plan allows
# 100 rule runs a month and stops *every* rule for the rest of the month once the
# cap is hit, so everything in the GitHub → Jira direction is done from Actions.
#
# The rule sends only the issue key. Anything else would have to be interpolated
# into the rule's JSON body by hand, and a ticket titled 카카오 "간편" 로그인 would
# break the request. Keys are [A-Z]+-[0-9]+, so nothing here can ever need
# escaping; the rest of the ticket is fetched from Jira below.
on:
  repository_dispatch:
    types: [jira_issue_started]

permissions:
  contents: write
  issues: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: 티켓 키 검증
        id: key
        env:
          # client_payload is attacker-controlled for anyone who can reach the
          # dispatch endpoint, so it goes through env and is validated before use.
          KEY: ${{ github.event.client_payload.key }}
          PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          if ! printf '%s' "$KEY" | grep -qE "^${PROJECT_KEY}-[0-9]+$"; then
            echo "::error::'${KEY}' 는 ${PROJECT_KEY} 이슈 키 형식이 아닙니다"
            exit 1
          fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: 체크아웃
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Jira 티켓 조회
        id: jira
        env:
          KEY: ${{ steps.key.outputs.key }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          . .github/scripts/jira.sh
          jira_get "$KEY" > issue.json

          # Matched on issue type id, not name: this Jira was created from the
          # Korean template, so the names are 스토리/버그, and a rename in the
          # Jira UI would silently change what is in scope. Ids never move.
          # This decides only *whether* a ticket gets a branch — what kind of
          # work it is comes from the title prefix below.
          type_id=$(jq -r '.fields.issuetype.id' issue.json)
          case "$type_id" in
            10004|10007|10003) : ;;  # 스토리 · 버그 · 작업
            *)
              echo "::error::이슈 타입 id=${type_id} 는 자동화 대상이 아닙니다 (스토리·버그·작업만). Jira 자동화 흐름의 조건을 확인하세요."
              exit 1 ;;
          esac

          # Titles carry quotes and the odd newline, so these travel as files
          # rather than through step outputs.
          jq -r '.fields.summary' issue.json > summary.txt
          jq -r '.fields.assignee.displayName // "미지정"' issue.json > assignee.txt

          # 'feat: 소셜 로그인 구현' → feat. That one word becomes the branch
          # prefix, the GitHub label and the commit type, so there is a single
          # convention to teach rather than three.
          lower=$(tr 'A-Z' 'a-z' < summary.txt)
          kind=$(printf '%s' "$lower" \
                 | sed -nE 's/^[[:space:]]*(feat|fix|refactor|test|chore|docs)[[:space:]]*:.*/\1/p')

          # Forgetting the prefix must not block the work, so fall back to the
          # issue type and warn rather than fail.
          if [ -z "$kind" ]; then
            case "$type_id" in
              10004) kind=feat  ;;
              10007) kind=fix   ;;
              10003) kind=chore ;;
            esac
            echo "::warning::${KEY} 제목에 작업 종류 접두사가 없어 업무 유형으로 대체했습니다 → ${kind}. 권장 형식: 'feat: 소셜 로그인 구현'"
          fi

          {
            echo "branch=${kind}/${KEY}"
            echo "label=$kind"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::${KEY} · $(cat summary.txt) · 담당 $(cat assignee.txt) · 종류 ${kind}"

      - name: 브랜치 생성
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.jira.outputs.branch }}
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$base" --jq .object.sha)

          # Bouncing a ticket out of 진행 중 and back is routine, so an existing
          # branch is a success, not a failure.
          if out=$(gh api "repos/$GITHUB_REPOSITORY/git/refs" \
                     -f "ref=refs/heads/$BRANCH" -f "sha=$sha" 2>&1); then
            echo "::notice::$BRANCH 생성 (기준: $base@$(printf '%s' "$sha" | cut -c1-7))"
          elif printf '%s' "$out" | grep -q "Reference already exists"; then
            echo "::notice::$BRANCH 는 이미 있습니다"
          else
            echo "::error::브랜치 생성 실패: $out"
            exit 1
          fi

      - name: GitHub 이슈 생성
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.key }}
          LABEL: ${{ steps.jira.outputs.label }}
          BRANCH: ${{ steps.jira.outputs.branch }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        run: |
          existing=$(gh issue list --state all --search "\"[$KEY]\" in:title" \
                       --json number,title \
                       --jq "first(.[] | select(.title | startswith(\"[$KEY]\")) | .number) // empty")

          # Both paths set the url output — the Slack step links to the issue, and
          # re-entering 진행 중 must not drop that link.
          if [ -n "$existing" ]; then
            echo "::notice::#$existing 이 이미 $KEY 를 추적하고 있습니다"
            url=$(gh issue view "$existing" --json url --jq .url)
          else
            body=$(printf '%s\n' \
              "**Jira:** ${JIRA_BASE_URL%/}/browse/$KEY" \
              "**담당자:** $(cat assignee.txt)" \
              "**브랜치:** \`$BRANCH\`" \
              "" \
              "---" \
              "" \
              "Jira에서 자동 생성된 미러 이슈입니다. 작업 내용은 Jira 티켓에서 관리하고," \
              "이 이슈는 PR이 병합되면 자동으로 닫힙니다.")

            url=$(gh issue create --title "[$KEY] $(cat summary.txt)" \
                    --body "$body" --label "$LABEL")
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Slack 알림
        env:
          # Checked in-script rather than in `if:` — step-level env isn't
          # available to the `if` expression, and secrets never are.
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_TICKETS }}
          KEY: ${{ steps.key.outputs.key }}
          BRANCH: ${{ steps.jira.outputs.branch }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "::notice::SLACK_WEBHOOK_TICKETS 미설정 — 알림 건너뜀"; exit 0; }

          # <url|text> is Slack's link syntax, so the raw URL never takes up a
          # line. unfurl is off because this channel is meant to stay two lines
          # per message — a preview card would swamp it, and the same PR already
          # unfurls in #2-리뷰-요청.
          meta="담당 $(cat assignee.txt) | \`$BRANCH\` | <${JIRA_BASE_URL%/}/browse/$KEY|Jira 티켓>"
          [ -n "$ISSUE_URL" ] && meta="$meta | <$ISSUE_URL|GitHub 이슈>"

          text=$(printf '🚀 *%s 시작* — %s\n%s' "$KEY" "$(cat summary.txt)" "$meta")

          curl -sS --fail-with-body -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg t "$text" \
                  '{text: $t, unfurl_links: false, unfurl_media: false}')"
