# 프로덕션에서는 Swagger UI 와 OpenAPI 스펙을 모두 닫는다.
# 스펙(/v3/api-docs)까지 끄지 않으면 UI 만 가려도 문서가 그대로 노출된다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# TODO: RDS 생성 전이라 이 값들이 아직 주입되지 않는다. RDS 를 만들고 GitHub Secrets 와
# ci-cd.yml 의 docker run 에 DB_URL · DB_USERNAME · DB_PASSWORD 를 넣으면 이 주석을 지운다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
