# 로컬 개발 프로파일. docker-compose.yml 로 띄운 MySQL 을 가리킨다.
#
#   docker compose up -d
#   SPRING_PROFILES_ACTIVE=local ./gradlew bootRun
#
# 기본값은 docker-compose.yml · .env.example 의 기본값과 같다.
# `.env` 를 손대지 않았다면 환경변수를 하나도 넣지 않아도 붙는다.
#
# 접속 정보를 base(application.yml)에 두지 않는 이유 — base 에 두면
# prod 가 이 값을 물려받는다. 프로파일마다 명시하게 해서 운영이 실수로
# 로컬 DB 를 가리키는 경로를 아예 없앤다.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:duckmoim}?characterEncoding=UTF-8&connectionTimeZone=UTC&rewriteBatchedStatements=true
    username: ${DB_USERNAME:duckmoim}
    password: ${DB_PASSWORD:duckmoim}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
