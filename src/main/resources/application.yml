spring:
  application:
    name: duckmoim

  # 접속 정보가 프로파일별 파일에만 있어서, 프로파일 없이 띄우면 DataSource 를
  # 못 찾고 기동이 실패한다. 로컬에서 매번 손으로 지정하지 않게 기본값을 둔다.
  # active 가 아니라 default 라서 배포의 SPRING_PROFILES_ACTIVE=prod 를 가리지 않는다.
  profiles:
    default: local

  jpa:
    open-in-view: false

# 헬스체크와 지표. 두 소비자가 있다 — ALB 대상 그룹의 상태 검사와 ci-cd.yml 의 배포 전환
# 게이트다. 둘 다 /actuator/health 를 보고, 그 값이 DB 커넥션까지 확인한 결과여야
# 「DB 에 못 붙는 버전으로 전환」이 막힌다.
management:
  endpoints:
    web:
      exposure:
        # 이 둘만 연다. "*" 로 열면 /actuator/env 와 /actuator/configprops 가
        # DB_PASSWORD · JWT_SECRET · INGEST_KEY 를 평문으로 돌려주는데, 8080 이
        # 0.0.0.0/0 이라 여는 즉시 인터넷에 노출된다.
        include: health,prometheus
  endpoint:
    health:
      # 지표 이름과 실패 사유가 그대로 나가면 내부 구성이 드러난다. 상태 검사는
      # UP/DOWN 만 알면 되고, 무엇이 왜 죽었는지는 로그와 대시보드에서 본다.
      show-details: never
  health:
    diskspace:
      # 기본 임계는 여유 10MB 이고 루트 볼륨이 8GB 다. 걸리면 두 인스턴스가 같은 속도로
      # 차서 동시에 DOWN 이 되고, ALB 는 healthy 대상이 0 이 되어 전부 503 을 낸다 —
      # DB 가 멀쩡한데도 그렇다. 상태 검사는 「요청을 처리할 수 있는가」만 판정한다.
      enabled: false
  metrics:
    tags:
      # 두 인스턴스의 지표가 한 곳에 모이므로 어느 앱의 것인지 이름을 붙여 둔다.
      application: duckmoim

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

# 토큰 서명 열쇠. local·test 는 아래 기본값으로 뜨고, prod 는 기본값 없이 필수로 건다
# (application-prod.yml). 기본값을 운영까지 남기면 기본 시크릿으로 배포되는 사고가 난다.
duckmoim:
  jwt:
    secret: ${JWT_SECRET:duckmoim-local-development-secret-do-not-use-in-production}
    access-token-ttl: 30m
    refresh-token-ttl: 14d

  # 크롤러 적재 키 (EV-03 · D-11). 사람이 아니라 GitHub Actions 가 보낸다.
  # jwt.secret 과 같은 배치다 — local·test 는 아래 기본값으로 뜨고 prod 는 필수다.
  ingest:
    key: ${INGEST_KEY:duckmoim-local-ingest-key-do-not-use-in-production}

  catalog:
    # 이 시간 동안 크롤러에 안 잡힌 행사를 목록에서 숨긴다 (D-7).
    #
    # 72시간인 이유 — 잡이 하루 한 번(04:00 KST)이라 이틀 연속 실패해도 멀쩡한 행사가
    # 사라지지 않는다. 잡 실패 횟수가 아니라 시각으로 판정하는 이유는, 카운터 방식은
    # 잡이 멈춘 동안 카운터도 멈춰서 유령이 무한히 남기 때문이다.
    #
    # 잠정값이다. 전환(EV-08) 이후 실측으로 조정한다.
    stale-after: 72h

  # 프론트(Vercel)와 API(AWS)가 다른 도메인이라 브라우저 호출에 CORS 가 필요하다.
  # 쿠키를 쓰지 않으므로 credentials 는 열지 않는다 (ADR 0001).
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # 주기 작업 (PO-14 마감 배치). 문서가 주기를 정하지 않아 여기서 정한다.
  #
  # 5분인 근거 — 이 배치가 늦어서 생기는 일은 카드 배지가 「모집중」인 채로 남는 것
  # 하나이고 돈이나 권한이 걸린 전이가 아니다. 반대로 1분마다 돌면 대부분의 실행이
  # 0건을 세고 끝난다.
  #
  # local 에서도 돈다. 끄는 스위치를 두지 않는 것은, 개발 중에 안 도는 배치는 배포
  # 후에 처음 돌고 그때 처음 틀린 것을 알기 때문이다.
  # chunk 는 한 트랜잭션이 닫을 최대 건수다. 밀린 글 전부를 한 트랜잭션에 담으면
  # 롤백 단위가 통째가 되고, 잠긴 행이 커밋 전까지 풀리지 않아 방장의 마감 요청이
  # 그 뒤에서 기다린다.
  batch:
    post-close:
      cron: ${POST_CLOSE_CRON:0 */5 * * * *}
      chunk: 200

  # 알림 발송 워커 (NT-02 · NT-03).
  #
  # 10초인 근거 — 마감 배치와 반대다. 알림이 늦으면 그것이 곧 사용자가 보는 지연이고,
  # 「댓글 달렸다」를 5분 뒤에 받으면 다시 부르는 효과가 사라진다. 대신 대부분의 실행이
  # 0건이라 그때는 로그를 남기지 않는다.
  #
  # backoff 는 실패 뒤 다음 시도까지 기다리는 간격이다. 지금 쓰이는 것은 앞의 둘 —
  # max-attempts 가 셋이라 세 번째 실패는 기다리지 않고 DLQ 로 간다. 25m 를 남긴 것은
  # 5배수 모양을 잃지 않으려는 것이고, 상한을 올리면 그대로 쓰인다.
  #
  # max-attempts 를 셋으로 둔 근거는 NT-03 의 검증 기준 「3회 실패 건이 DLQ 에 있다」다.
  notification:
    worker:
      cron: ${NOTIFICATION_WORKER_CRON:*/10 * * * * *}
      chunk: 100
      max-attempts: 3
      backoff: 1m,5m,25m
      # 선점한 건을 남이 못 집게 막아 두는 시간 (NT-04). 한 건의 발송이 밀리초라 넉넉하고,
      # 가장 짧은 백오프(1분)보다 짧아 재시도 간격과 뒤섞이지 않는다. 워커가 죽으면 이 시간
      # 뒤에 그 건이 저절로 다시 집힌다.
      lease: 30s
    # 적체 관측 (NT-05). 발송 주기와 따로 두는 이유는 NotificationBacklogBatch 주석에 있다.
    backlog:
      cron: ${NOTIFICATION_BACKLOG_CRON:0 * * * * *}

  # 카카오 로그인 (AU-01). 우리 로그인은 이것 하나뿐이다.
  #
  # local·test 는 아래 더미 값으로 뜬다 — 열쇠가 없어도 기동과 테스트가 돌아야 한다
  # (카카오를 부르는 자리를 테스트가 대역으로 갈아끼운다). prod 는 기본값이 없다.
  #
  # redirect-uri 는 여기 없다. 카카오가 인가 때 쓴 값과의 일치를 강제하는데 그 값은
  # 브라우저 origin + /auth/kakao/callback 이라 로컬·프리뷰·프로덕션이 각각 다르다.
  # 서버가 하나로 못박으면 백엔드 한 대가 프론트 한 곳만 상대하게 된다. 요청 바디로 받는다.
  kakao:
    client-id: ${KAKAO_CLIENT_ID:kakao-local-dummy-rest-api-key}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    token-uri: https://kauth.kakao.com/oauth/token
    user-uri: https://kapi.kakao.com/v2/user/me
    # 없으면 카카오가 응답을 안 줄 때 스레드가 무한정 매달린다. 이 호출은
    # 트랜잭션 밖이지만 톰캣 스레드는 그대로 잡는다.
    connect-timeout: 3s
    read-timeout: 5s

  # 프로필 이미지 업로드 (AU-08). 브라우저가 S3 로 직접 올리고 서버는 서명만 한다.
  #
  # 버킷 이름이 비어 있으면 S3 구현 대신 대역이 뜬다 — 프로파일로 가르지 않는 이유는
  # 자격증명을 가진 개발자가 로컬에서 실물을 확인할 길을 막지 않으려는 것이다.
  # prod 는 기본값이 없다 (application-prod.yml).
  #
  # 자격증명을 여기 두지 않는다. EC2 인스턴스 역할을 SDK 기본 공급자가 읽는다 —
  # ci-cd.yml 이 ECR 로그인을 같은 방식으로 한다.
  s3:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    # 저장되는 profile_image_url 의 앞부분. CloudFront 를 앞에 세우면 이 값만 바뀐다 —
    # 코드에 박으면 이미 저장된 값 전부가 마이그레이션 대상이 된다.
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    # 서명의 유효 시간. 사용자가 파일을 고르고 올리는 데 걸리는 시간이라 짧게 둔다.
    presign-ttl: 5m

  profile-image:
    # 위키에 값이 없어 정했다. 아바타라 큰 파일을 받을 이유가 없다.
    max-bytes: 5242880
    allowed-content-types: image/jpeg,image/png,image/webp
