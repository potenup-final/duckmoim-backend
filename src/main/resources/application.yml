spring:
  application:
    name: duckmoim

# Swagger UI 는 /swagger-ui.html, 스펙은 /v3/api-docs 로 노출한다.
# 프로덕션(prod 프로파일)에서는 application-prod.yml 이 둘 다 끈다.
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
