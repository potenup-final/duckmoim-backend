services:
  mysql:
    image: mysql:8.4
    container_name: duckmoim-mysql
    restart: unless-stopped

    # 호스트 쪽만 3307 이다. 개발자 PC 의 네이티브 MySQL 과 부딪히지 않아야 한다.
    ports:
      - "${DB_PORT:-3307}:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-duckmoim}
      MYSQL_USER: ${DB_USERNAME:-duckmoim}
      MYSQL_PASSWORD: ${DB_PASSWORD:-duckmoim}

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --skip-name-resolve

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
    name: duckmoim-mysql-data
