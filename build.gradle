plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '7.0.2'
}

group = 'com.duckmoim'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()

	// 위반 픽스처는 아키텍처 규칙을 일부러 어기는 클래스라 테스트로 실행하지 않는다.
	// 이름을 *Test 로 안 지으면 안 잡힐 거라 봤지만, Gradle 은 클래스 파일을 훑어
	// 플랫폼에 넘기므로 이름 규칙이 걸리지 않는다. 컴파일은 그대로여서 ArchUnit 은
	// 계속 읽는다.
	exclude '**/architecture/fixture/**'
}

// 포맷을 부탁하지 않고 강제한다. 에이전트가 어떤 스타일로 써도 spotlessApply 한
// 번에 통일되고, 어긋난 채로 올라오면 check 가 막는다. 리뷰에서 포맷 지적이 사라진다.
//
// googleJavaFormat 은 설정 항목이 없다. 그게 고른 이유다 — 다툴 여지가 생기지 않는다.
spotless {
	java {
		googleJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// Spotless 가 포맷을 보고, Checkstyle 은 포맷으로 판정할 수 없는 것을 본다 —
// 로그 prefix, 로그 문자열 더하기, 테스트 메서드 네이밍. 위키 코드·테스트 컨벤션에서
// 기계가 판정할 수 있는 항목만 옮겼다.
//
// main 과 test 의 메서드 네이밍 규칙이 달라 설정을 둘로 나눈다.
// 테스트는 실패 케이스를 pay_pointIsNotEnough 형식으로 쓰므로 밑줄을 허용해야 한다.
checkstyle {
	toolVersion = '10.21.1'
	maxWarnings = 0
}

tasks.named('checkstyleTest') {
	configFile = file("${rootDir}/config/checkstyle/checkstyle-test.xml")
}

tasks.register('installGitHooks', Exec) {
	description = '커밋 제목에 Jira 키를 자동으로 붙이는 .githooks 를 활성화한다'
	group = 'build setup'
	onlyIf { file("${rootDir}/.git").exists() }
	commandLine 'git', 'config', 'core.hooksPath', '.githooks'
	ignoreExitValue = true
}

// git pull 과 checkout 이 서브모듈까지 따라오게 한다. 이게 없으면 위키가
// 조용히 옛 커밋에 머물고, 사람은 최신 스펙을 읽는다고 착각한다.
tasks.register('configureSubmoduleRecurse', Exec) {
	description = 'pull · checkout 이 서브모듈을 함께 갱신하도록 설정한다'
	group = 'build setup'
	onlyIf { file("${rootDir}/.git").exists() }
	commandLine 'git', 'config', 'submodule.recurse', 'true'
	ignoreExitValue = true
}

// docs/wiki 는 [1] 컨텍스트 확보가 읽는 곳이다. 클론 직후 비어 있을 때만 채운다.
//
// ⚠️ 비었을 때만 도는 것이 중요하다. `git submodule update --init` 은 **기록된
//    커밋**으로 체크아웃하므로, 조건 없이 매 빌드마다 돌리면 포인터를 올리려고
//    실행한 `--remote` 를 되돌린다. 그 상태에서 `git add docs/wiki` 를 하면 옛
//    핀이 커밋되고, 팀원은 갱신된 줄 알았던 옛 문서를 읽는다. 실제로 겪었다.
//
// 위키는 PRIVATE 이라 접근 권한이 없으면 실패한다. 그때 조용히 넘기지 않는다 —
// 빌드는 통과하는데 에이전트가 스펙을 못 읽는 상태가 가장 나쁘다. 알아채지
// 못한 채로 "일반적으로 맞는" 코드가 나온다.
tasks.register('initWiki', Exec) {
	description = '위키 서브모듈이 비어 있으면 초기화한다 (docs/wiki)'
	group = 'build setup'
	onlyIf {
		file("${rootDir}/.gitmodules").exists() &&
			!file("${rootDir}/docs/wiki/README.md").exists()
	}
	commandLine 'git', 'submodule', 'update', '--init', 'docs/wiki'
	ignoreExitValue = true

	doLast {
		if (executionResult.get().exitValue != 0) {
			logger.warn('''
========================================================================
 위키 서브모듈(docs/wiki) 을 가져오지 못했습니다.

 빌드와 테스트는 그대로 됩니다. 다만 요구사항 검증 기준 · 불변식 ·
 설계 결정을 읽을 수 없어, 에이전트가 컨텍스트 없이 코드를 씁니다.

 위키는 PRIVATE 입니다. potenup-final/duckmoim-wiki 접근 권한을
 받은 뒤 아래를 실행하세요.

   git submodule update --init docs/wiki
========================================================================'''.stripIndent())
		}
	}
}

tasks.named('compileJava') {
	dependsOn 'installGitHooks', 'configureSubmoduleRecurse', 'initWiki'
}
